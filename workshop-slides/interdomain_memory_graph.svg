<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Domain 1 to Domain 2 flow diagram</title>
<desc>A box in Domain 1 branches to two boxes; one of those crosses into Domain 2 to a three-cell box, which itself branches to two more boxes, and a short arrow rises from Domain 2 back up into the first box.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

<line x1="20" y1="248" x2="660" y2="252" stroke="#888780" stroke-width="1.5"/>
<text x="30" y="30" font-family="sans-serif" font-weight="500" font-size="22px" fill="#2C2C2A">Domain 1</text>
<text x="30" y="280" font-family="sans-serif" font-weight="500" font-size="22px" fill="#2C2C2A">Domain 2</text>

<rect x="148" y="93" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<rect x="345" y="38" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<rect x="345" y="118" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<rect x="440" y="330" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>
<rect x="500" y="330" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>
<rect x="560" y="330" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<rect x="555" y="150" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<rect x="500" y="420" width="60" height="50" rx="8" stroke-width="2.5" fill="#E6F1FB" stroke="#185FA5"/>

<line x1="178" y1="290" x2="178" y2="146" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="208" y1="108" x2="343" y2="62" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="208" y1="130" x2="343" y2="142" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="378" y1="170" x2="465" y2="328" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="516" y1="328" x2="580" y2="202" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="530" y1="382" x2="530" y2="418" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
